[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nirikshak"
version = "0.3.0"
description = "Zero-shot visual quality inspection on Snapdragon: a three-tier NPU cascade for MSME manufacturing. By Jash Pasad, IIT Gandhinagar."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jash Pasad" }]
maintainers = [{ name = "Jash Pasad" }]
keywords = ["snapdragon", "npu", "hexagon", "anomaly-detection", "quality-inspection", "edge-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.9"]

[project.urls]
Homepage = "https://github.com/jashpasad/NIRIKSHAK"
Repository = "https://github.com/jashpasad/NIRIKSHAK"

[project.optional-dependencies]
snapdragon = ["onnxruntime-qnn>=1.20", "geniex", "qai-hub", "qai-hub-models"]
ui = ["fastapi>=0.115", "uvicorn>=0.34"]
dev = ["pytest>=8.0"]

[project.scripts]
nirikshak = "nirikshak.cli:main"

[tool.setuptools.packages.find]
include = ["nirikshak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
